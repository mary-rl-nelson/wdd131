<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Character Card">
    <meta property="og:description" content="Level up your character with this card! Fight
    for your life, and your character's life, with this website. This is a character card 
    that you can use to keep track of your character's stats.">
    <meta property="og:url" content="https://mary-rl-nelson.github.io/wdd131/charactercard/index.html">
    <meta property="og:image" content="images/default.png">

    <!-- Twitter Card -->
    <meta name="twitter:card" content="Choose your character!">
    <meta name="twitter:title" content="Character Card">
    <meta name="twitter:description" content="Level up your character with this card! Fight
    for your life, and your character's life, with this website. This is a character card 
    that you can use to keep track of your character's stats, abilities, and more.">
    <meta name="twitter:image" content="images/default.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="images/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/appleicon.png">
    
    <meta name="author" content="Mary Frazier">
    <meta name="description" content="Character card for tracking stats and health of character.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Character Card</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" 
    rel="stylesheet" 
    integrity="sha384-9ndCyUaIbzAi2FUVXJi0CjmCapSmO7SnpJef0486qhLnuZ2cdeRhO02iuK6FUUVM" 
    crossorigin="anonymous" rel="stylesheet"> 
    <link rel="stylesheet" href="character.css">
    <script src="character.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>Character Card</h1>
        <label for="character-select">Choose a character:</label>
        <select id="character-select">
            <option value="">-- Select --</option>
            <option value="veywrath">Veywrath</option>
            <option value="pipkin">Pipkin</option>
            <option value="korrath">Korrath</option>
            <option value="thistlewick">Thistlewick</option>
            <option value="goldwreath">Goldwreath</option>
            <option value="aeltharion">Aeltharion</option>
        </select>

        <div class="card">
            <img class="image" alt="Character Image" src="images/default.png " width="600" height="600">
            <h1 class="characterName"></h1>
            <h2>Statistics</h2>
            <section class="stats">
                <p class="stat">Strength: <span class="strength"></span></p>
                <p class="stat">Stealth: <span class="stealth"></span></p>
                <p class="stat">Deception: <span class="deception"></span></p>
                <p class="stat">Intelligence: <span class="intelligence"></span></p>
                <p class="stat">Charisma: <span class="charisma"></span></p>
                <p class="stat">Class: <span class="class"></span></p>
                <p class="stat">Health: <span class="health"></span></p>
                <p class="stat">Level: <span class="level"></span></p>
            </section>
            <section class="buttonlayout">
                <button class="attack">Attacked</button>
                <button class="levelup">Level Up</button>
            </section>
        </div>
    </main>
</body>
</html>
