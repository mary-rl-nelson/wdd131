<!DOCTYPE html>
<html lang="en">
<head>
    
    <!-- Open Graph (Facebook, LinkedIn, etc.) -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="Your Title">
    <meta property="og:description" content="Your Description">
    <meta property="og:url" content="Your URL">
    <meta property="og:image" content="social-preview-image.png">

    <!-- X Card -->
    <meta name="twitter:card" content="Social Preview Image">
    <meta name="twitter:title" content="Your Title">
    <meta name="twitter:description" content="Your Description">
    <meta name="twitter:image" content="social-preview-image.png">

    <!-- One favicon (ICO works everywhere) -->
    <link rel="icon" href="/favicon.ico">

    <!-- One Apple Touch Icon (iOS home screen) -->
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
                    
    <meta charset="UTF-8">
    <meta name="author" content="Mary Frazier">
    <meta name="description" content="Store, find, and create recipes.">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recipe Book</title>
    <link rel="stylesheet" href="recipe.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amatic+SC:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <img class="logo" alt="logo" src="images/recipe-book.png">
        <h1>Recipe Book</h1>
    </header>
    <main>
        <div class="search-container">
            <input type="text" name="searchfield" id="searchfield" placeholder="Find a recipe">
            <img src="images/search.svg" alt="search icon" class="search-icon">
        </div>
        <hr>
        <section class="recipe-card">
            <div class="card-image">
                <img src="images/apple-crisp.jpg" alt="apple crisp photo">
            </div>
            <div class="card-content">
                <label class="food-type">dessert</label>
                <h3 class="recipe-name">Apple Crisp</h3>
                
                <span class="rating" role="img" aria-label="Rating: 4 out of 5 stars">
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star">⭐</span>
                    <span aria-hidden="true" class="icon-star-empty">☆</span>
                </span>

                <p class="description">
                    This apple crisp recipe is simple yet delicious fall dessert
                    that's great served warm with vanilla icecream.
                </p>
                                
            </div>
            

        </section>

    </main>
                            
    <footer>
        <div class="social">
        <!-- Social media icons provided under CC from https://www.iconfinder.com/AlfredoCreates  -->
            <a href="#"><img src="images/instagram_icon.svg" alt="instagram icon"></a>
            <a href="#"><img src="images/youtube_icon.svg" alt="youtube icon"></a>
            <a href="#"><img src="images/pinterest_icon.svg" alt="pinterest icon"></a>
        </div>    
        <a class="source" href="https://www.flaticon.com/free-icons/recipe" title="recipe icons">Recipe icons created by Freepik - Flaticon</a>                     
    </footer>
</body>
</html>
